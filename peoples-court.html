<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>People's Court™ | The Archives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #120821;
    --twilight: #341251;
    --magenta: #7c2f6e;
    --rose: #d94f8c;
    --gold: #f2c14e;
    --mist: #f4e9ff;
    --dim: #d1c1e0;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--ink); color: var(--mist);
    font-family: 'Jost', sans-serif; overflow: hidden;
  }

  /* --- ATMOSPHERIC BACKGROUND --- */
  .sky {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(200deg, rgba(10,3,17,0.55) 0%, rgba(18,8,33,0.6) 25%, rgba(35,12,51,0.72) 60%, rgba(74,25,73,0.8) 100%),
      url('background-court.png');
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    background-color: #0a0311;
  }
  .sky::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(1.5px 1.5px at 15% 12%, rgba(255,255,255,0.8) 100%, transparent),
                      radial-gradient(1.5px 1.5px at 65% 22%, rgba(242, 193, 78, 0.6) 100%, transparent),
                      radial-gradient(2px 2px at 85% 6%, rgba(255,255,255,0.6) 100%, transparent);
    opacity: 0.6; animation: sky-twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes sky-twinkle { 0% { opacity: 0.4; } 100% { opacity: 0.8; } }

  /* --- PERSISTENT BACK TO ITINERARY LINK (Minimalist) --- */
  .itinerary-link {
    position: fixed; top: 24px; left: 24px; z-index: 500;
    display: flex; align-items: center; gap: 10px;
    font-family: 'Space Mono', monospace; font-size: 9px;
    letter-spacing: 0.18em; text-transform: uppercase; color: rgba(244, 233, 255, 0.5);
    text-decoration: none; opacity: 0.7;
    transition: opacity 0.3s ease, color 0.3s ease;
  }

  .itinerary-link:hover, .itinerary-link:active {
    opacity: 1;
    color: var(--gold);
  }

  .itinerary-link svg {
    flex-shrink: 0;
    width: 14px; height: 14px;
    stroke-width: 1.5px;
    transition: transform 0.3s cubic-bezier(0.2, 1, 0.3, 1);
  }

  /* Subtle interaction: the arrow glides back slightly when hovered/tapped */
  .itinerary-link:hover svg, .itinerary-link:active svg {
    transform: translateX(-4px);
  }

  /* --- ORNATE 3D DOORS (Refined & Cinematic) --- */
  .doors-wrapper {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; perspective: 2000px; /* Deepened perspective */
    pointer-events: none;
    background: #000; /* Start in pure darkness */
    transition: background 2s ease 1s;
  }
  .doors-wrapper.open {
    background: transparent;
  }

  .door {
    width: 50%; height: 100%;
    background: #0a0510; /* Near black */
    border: none;
    display: flex; align-items: center; justify-content: center;
    /* Slowed down to 4 seconds with a highly dramatic, smooth ease-out */
    transition: transform 4s cubic-bezier(0.2, 1, 0.3, 1), opacity 3s ease 1.5s;
    box-shadow: inset 0 0 150px rgba(0,0,0,1), inset 0 0 20px rgba(242, 193, 78, 0.05);
    position: relative; overflow: hidden;
  }
  .door::before {
    content: ''; position: absolute; top: 10%; bottom: 10%; left: 10%; right: 10%;
    border: 1px solid rgba(242, 193, 78, 0.1); border-radius: 4px;
  }
  .door.left { transform-origin: left; border-right: 1px solid rgba(242, 193, 78, 0.2); }
  .door.right { transform-origin: right; border-left: 1px solid rgba(242, 193, 78, 0.2); }

  /* Minimalist, elegant handles */
  .door-handle {
    width: 3px; height: 140px; border-radius: 2px;
    background: linear-gradient(to bottom, rgba(242,193,78,0.2), var(--gold), rgba(242,193,78,0.2));
    box-shadow: 0 0 10px rgba(242, 193, 78, 0.2);
    z-index: 2;
  }
  .door.left .door-handle { margin-left: auto; margin-right: 25px; }
  .door.right .door-handle { margin-right: auto; margin-left: 25px; }

  /* Remove the tacky glowing laser beam entirely */
  .light-seam { display: none; }

  .doors-wrapper.open .door.left { transform: rotateY(-105deg); opacity: 0; }
  .doors-wrapper.open .door.right { transform: rotateY(105deg); opacity: 0; }

  /* --- SHARED UI --- */
  .court-container {
    position: relative; z-index: 10;
    width: 100%; height: 100%;
    overflow-y: auto; overflow-x: hidden;
    padding: 60px 24px 80px; display: flex; flex-direction: column; align-items: center;
  }
  #phaseIntro { padding-top: 52vh; }
  .display { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-style: italic; font-weight: 500; margin: 0 0 24px 0; text-align: center; text-shadow: 0 4px 15px rgba(0,0,0,0.6); }

  .section-layer {
    width: 100%; max-width: 600px;
    display: none; flex-direction: column; align-items: center;
    opacity: 0; animation: fade-up 0.8s ease forwards;
  }
  .section-layer.active { display: flex; }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- PHASE 1: JUDGE SASHA LORE (Cinematic Text) --- */
  .judge-header {
    display: flex; flex-direction: column; align-items: center; margin-bottom: 24px;
  }

  /* Redesigned as an authoritative desk plaque */
  .judge-name-pill {
    font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gold); background: transparent;
    border: 1px solid rgba(242, 193, 78, 0.3); border-radius: 4px;
    padding: 8px 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    opacity: 0; animation: fade-up 1s ease forwards;
  }

  /* --- PHASE 1: LORE PROLOGUE (Literary Format) --- */
  .thread {
    width: 100%; display: flex; flex-direction: column; align-items: center;
    gap: 28px; margin-bottom: 40px; padding: 0 10px;
  }
  @keyframes bubble-in { to { opacity: 1; transform: translateY(0); } }

  .lore-paragraph {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-style: italic;
    font-weight: 400;
    line-height: 1.55;
    color: rgba(244, 233, 255, 0.9);
    text-align: center;
    text-shadow: 0 4px 15px rgba(0,0,0,0.8);
    opacity: 0;
    transform: translateY(15px);
    transition: opacity 2.5s ease, transform 2.5s cubic-bezier(0.2, 1, 0.3, 1);
  }

  .lore-paragraph.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .skip-btn {
    background: none; border: none; color: var(--dim);
    font-family: 'Space Mono', monospace; font-size: 10px;
    letter-spacing: 0.15em; text-transform: uppercase;
    text-decoration: underline; cursor: pointer;
    opacity: 0.5; transition: opacity 0.3s ease;
    margin-top: 10px; padding: 10px;
  }
  .skip-btn:active { opacity: 1; }

  .btn-gold {
    background: linear-gradient(135deg, #ffdf94 0%, var(--gold) 100%);
    color: var(--ink); border: none; border-radius: 999px;
    padding: 16px 36px; font-family: 'Jost', sans-serif; font-weight: 600; font-size: 15px;
    letter-spacing: 0.05em; cursor: pointer; box-shadow: 0 8px 20px rgba(242, 193, 78, 0.3);
    transition: transform 0.2s ease; display: inline-flex; align-items: center; gap: 8px;
    opacity: 0; animation: bubble-in 0.6s ease forwards;
  }
  .btn-gold:active { transform: scale(0.95); }
  .btn-sub {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14px;
    color: var(--dim); margin-top: 10px; opacity: 0; animation: bubble-in 0.6s ease forwards;
  }

  /* --- PHASE 2: EMAIL INBOX (THE DOCKET) --- */
  .email-client {
    width: 100%; background: rgba(22, 10, 35, 0.85);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(244, 233, 255, 0.15); border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8); overflow: hidden;
    display: flex; flex-direction: column;
  }
  .inbox-toolbar {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(244, 233, 255, 0.08);
  }
  .icon-btn {
    background: none; border: none; color: var(--mist); cursor: pointer;
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease;
  }
  .icon-btn:active { background: rgba(244, 233, 255, 0.12); }
  .inbox-title-block { flex: 1; min-width: 0; }
  .email-title { font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 600; color: var(--mist); }
  .email-count { font-family: 'Jost', sans-serif; font-size: 12px; color: var(--gold); }
  .me-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #ffdf94, var(--gold));
    color: var(--ink); font-family: 'Jost', sans-serif; font-weight: 700; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }

  .search-row { padding: 12px 16px; border-bottom: 1px solid rgba(244, 233, 255, 0.08); }
  .search-bar {
    display: flex; align-items: center; gap: 10px;
    background: rgba(244, 233, 255, 0.06); border: 1px solid rgba(244, 233, 255, 0.1);
    border-radius: 999px; padding: 9px 16px; color: var(--dim); font-size: 13px;
  }
  .search-bar svg { flex-shrink: 0; opacity: 0.6; }

  .email-row {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid rgba(244, 233, 255, 0.05);
    cursor: pointer; transition: background 0.2s ease;
  }
  .email-row:hover { background: rgba(242, 193, 78, 0.08); }
  .email-row:last-child { border-bottom: none; }
  .email-row.read .email-subject { color: var(--dim); font-weight: 400; }

  .email-avatar {
    width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Jost', sans-serif; font-weight: 600; font-size: 14px; color: #fff;
    margin-top: 2px;
  }
  .email-content-preview { flex: 1; min-width: 0; text-align: left; }
  .email-subject { font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 600; color: var(--mist); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.3s ease; }
  .email-snippet { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.8; }
  .email-right-col { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; margin-top: 2px; }
  .email-time { font-family: 'Jost', sans-serif; font-size: 11px; color: var(--dim); }
  .email-star { opacity: 0.35; cursor: pointer; padding: 2px; transition: opacity 0.2s ease; }
  .email-star:active { opacity: 0.7; }
  .email-star.starred { opacity: 1; }

  /* --- PHASE 3: OPEN EMAIL & VOTING --- */
  .open-email-header { padding: 24px; border-bottom: 1px solid rgba(244, 233, 255, 0.1); background: rgba(0,0,0,0.2); text-align: left; }
  .oe-subject { font-family: 'Jost', sans-serif; font-size: 22px; font-weight: 600; color: var(--mist); margin-bottom: 16px; line-height: 1.3; }
  .oe-meta-grid { display: grid; grid-template-columns: 45px 1fr; gap: 6px; font-family: 'Space Mono', monospace; font-size: 11px; color: var(--mist); }
  .oe-meta-label { color: var(--dim); text-align: right; margin-right: 8px; }

  .open-email-body { padding: 28px 24px; text-align: left; font-family: 'Cormorant Garamond', serif; font-size: 19px; font-style: italic; line-height: 1.55; color: var(--mist); }

  .voting-dock { padding: 24px; background: rgba(0,0,0,0.3); border-top: 1px solid rgba(244, 233, 255, 0.1); }
  .aita-buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; margin: 0 auto; }
  .aita-btn {
    border: none; border-radius: 12px; cursor: pointer; display: block; width: 100%;
    font-family: 'Jost', sans-serif; font-weight: 700; padding: 20px 18px; font-size: 17px; letter-spacing: .04em; color: #fff;
    box-shadow: 0 6px 20px rgba(0,0,0,.3); transition: transform 0.2s ease, filter 0.2s ease;
  }
  .aita-btn:active { filter: brightness(0.8); transform: scale(0.97); }
  .aita-btn-red { background: linear-gradient(135deg, #b31f47, #750e2a); }
  .aita-btn-green { background: linear-gradient(135deg, #1b8c5e, #0d4d32); }

  .back-link { font-family: 'Jost', sans-serif; font-size: 14px; color: var(--dim); text-decoration: underline; margin-top: 24px; cursor: pointer; background: none; border: none; padding: 8px; }
  .back-link:active { opacity: 0.7; }

  /* --- FULL SCREEN VERDICT --- */
  .aita-verdict-card {
    position: fixed; inset: 0; z-index: 99999; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 26px;
    padding: 20px; text-align: center; opacity: 0; transition: opacity 0.5s ease;
  }
  .aita-verdict-card.visible { opacity: 1; }
  .aita-verdict-card.aita-red { background: #b31f47; }
  .aita-verdict-card.aita-green { background: #1b8c5e; }

  .aita-verdict-text {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 800;
    font-size: 18vw; max-font-size: 100px; line-height: 1.1; color: #fff; text-shadow: 6px 6px 0px rgba(0,0,0,0.4);
    margin-bottom: 20px; text-transform: uppercase; white-space: pre-line;
  }
  .btn-ghost {
    background: transparent; color: #fff; border: 2px solid rgba(255,255,255,0.6); border-radius: 999px;
    padding: 15px 35px; font-family: 'Jost', sans-serif; font-size: 15px; cursor: pointer; transition: background 0.2s ease;
  }
  .btn-ghost:active { background: rgba(255,255,255,0.1); }

  /* --- ELEGANT TOGGLABLE TIMER --- */
  .court-timer-wrap {
    position: fixed; top: 16px; right: 16px; z-index: 9999;
    display: flex; align-items: center; gap: 8px;
    background: rgba(18, 8, 33, 0.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(244, 233, 255, 0.15); border-radius: 999px;
    padding: 6px 14px 6px 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .court-timer-wrap.is-hidden {
    background: rgba(18, 8, 33, 0.2);
    border-color: rgba(244, 233, 255, 0.05);
    padding-right: 10px; /* Compress the pill */
  }

  .timer-toggle-btn {
    background: none; border: none; color: var(--dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 4px; transition: color 0.2s ease;
  }
  .timer-toggle-btn:active { color: var(--gold); }

  .court-timer-text {
    font-family: 'Space Mono', monospace; font-size: 13.5px;
    color: rgba(244, 233, 255, 0.65); /* Soft, dim text to reduce anxiety */
    transition: opacity 0.3s ease, width 0.3s ease;
    opacity: 1; width: 42px; text-align: right; overflow: hidden;
  }

  .court-timer-wrap.is-hidden .court-timer-text {
    opacity: 0; width: 0; margin-left: -8px; /* Collapses the gap */
  }

  /* Gentle "wrap it up soon" cue — last 3 minutes. Subtle, not alarming. */
  @keyframes courtTimerPulse {
    0%, 100% { box-shadow: 0 4px 15px rgba(0,0,0,0.3), 0 0 0px rgba(242,193,78,0); }
    50%      { box-shadow: 0 4px 15px rgba(0,0,0,0.3), 0 0 12px rgba(242,193,78,0.22); }
  }
  .court-timer-wrap.is-warning {
    border-color: rgba(242, 193, 78, 0.35);
    animation: courtTimerPulse 2.8s ease-in-out infinite;
  }
  .court-timer-wrap.is-warning .court-timer-text {
    color: rgba(242, 193, 78, 0.85);
  }
  .court-timer-wrap.is-warning .timer-toggle-btn {
    color: rgba(242, 193, 78, 0.7);
  }
</style>
</head>
<body>

  <div class="sky"></div>

  <a href="index.html" class="itinerary-link">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    Return
  </a>

  <!-- Opening Door Animation -->
  <div class="doors-wrapper" id="doors">
    <div class="door left"><div class="door-handle"></div></div>
    <div class="door right"><div class="door-handle"></div></div>
    <div class="light-seam"></div>
  </div>

  <!-- Main Scrollable Container -->
  <div class="court-container" id="courtContainer">

    <!-- Phase 1: Lore / Judge Sasha chat thread -->
    <div class="section-layer" id="phaseIntro">
      <div class="judge-header">
        <div class="judge-name-pill">Judge Sasha presiding</div>
      </div>

      <div class="thread" id="loreThread"></div>

      <div id="introCta" style="display:flex; flex-direction:column; align-items:center;"></div>
      <button id="skipLoreBtn" class="skip-btn" onclick="skipLore()">Skip introduction</button>
    </div>

    <!-- Phase 2: The Email Inbox -->
    <div class="section-layer" id="phaseDocket">
      <div class="email-client">
        <div class="inbox-toolbar">
          <button class="icon-btn" onclick="backToIntro()" aria-label="Back">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          </button>
          <div class="inbox-title-block">
            <div class="email-title">People's Court Inbox</div>
            <div class="email-count">6 unread</div>
          </div>
          <div class="me-avatar">JS</div>
        </div>
        <div class="search-row">
          <div class="search-bar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <span>Search letters</span>
          </div>
        </div>
        <div class="docket-list" id="docketList">
          <!-- Rendered via JS -->
        </div>
      </div>
    </div>

    <!-- Phase 3: Open Email & Voting -->
    <div class="section-layer" id="phaseStory">
      <div class="email-client">

        <div class="open-email-header">
          <div class="oe-subject" id="storySubject"></div>
          <div class="oe-meta-grid">
            <div class="oe-meta-label">From:</div>
            <div id="storySender"></div>
            <div class="oe-meta-label">To:</div>
            <div>Honorable Judge Sasha</div>
            <div class="oe-meta-label">Date:</div>
            <div id="storyDate"></div>
          </div>
        </div>
        <div style="width: 100%; height: 3px; background: rgba(244, 233, 255, 0.1);">
          <div id="caseTimerBar" style="height: 100%; width: 100%; background: var(--gold); transform-origin: left; transition: transform 1s linear;"></div>
        </div>

        <div class="open-email-body" id="storyDisplay"></div>

        <div class="voting-dock">
          <div class="aita-buttons">
            <button class="aita-btn aita-btn-red" onclick="castVote('YTA')">ASSHOLE</button>
            <button class="aita-btn aita-btn-green" onclick="castVote('NTA')">NOT THE ASSHOLE</button>
          </div>
        </div>

      </div>

      <button class="back-link" onclick="backToDocket()">Back to the inbox</button>
    </div>

  </div>

  <!-- Full Screen Verdict Card -->
  <div class="aita-verdict-card" id="verdictCard">
    <div class="aita-verdict-text" id="verdictText"></div>
    <p style="color: rgba(255,255,255,0.85); font-family: 'Jost', sans-serif; font-size: 18px; margin-bottom: 50px;">Hold your phone up so everyone can see.</p>
    <button class="btn-ghost" onclick="closeVerdict()">Return to the docket</button>
  </div>

  <!-- Elegant Togglable Global Timer -->
  <div id="courtTimerWrapper" class="court-timer-wrap" style="display: none;">
    <button id="btnToggleTimer" class="timer-toggle-btn" aria-label="Toggle Timer">
      <!-- Eye Open SVG -->
      <svg id="iconEyeOpen" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12c3-6 7-8 10-8s7 2 10 8-7 8-10 8-7-2-10-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <!-- Eye Closed SVG (Hidden by default) -->
      <svg id="iconEyeClosed" style="display: none;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    </button>
    <div id="globalCourtTimerText" class="court-timer-text">00:00</div>
  </div>

  <!-- Firebase Integration -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
  // --- FIREBASE SETUP ---
  const firebaseConfig = {
    apiKey: "AIzaSyDv47HEwF9APQLLoLdJgHwdLHzoYfTawyQ",
    authDomain: "relationships-d8119.firebaseapp.com",
    databaseURL: "https://relationships-d8119-default-rtdb.firebaseio.com",
    projectId: "relationships-d8119",
    storageBucket: "relationships-d8119.firebasestorage.app",
    messagingSenderId: "852389788989",
    appId: "1:852389788989:web:6c79282e08c665b54dd954"
  };
  const EVENT_ID = "default";

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  // --- TIMER TOGGLE LOGIC ---
  const timerWrapper = document.getElementById('courtTimerWrapper');
  const btnToggleTimer = document.getElementById('btnToggleTimer');
  const iconOpen = document.getElementById('iconEyeOpen');
  const iconClosed = document.getElementById('iconEyeClosed');
  let isTimerHidden = false;

  btnToggleTimer.addEventListener('click', () => {
    isTimerHidden = !isTimerHidden;
    if (isTimerHidden) {
      timerWrapper.classList.add('is-hidden');
      iconOpen.style.display = 'none';
      iconClosed.style.display = 'block';
    } else {
      timerWrapper.classList.remove('is-hidden');
      iconOpen.style.display = 'block';
      iconClosed.style.display = 'none';
    }
  });

  // --- GLOBAL TIMER SYNC ---
  let globalTimerInterval;
  db.ref(`events/${EVENT_ID}/peoplesCourtTimer`).on('value', snap => {
    const endTime = snap.val();
    clearInterval(globalTimerInterval);
    const timerTextEl = document.getElementById('globalCourtTimerText');

    if (!endTime) {
      timerWrapper.style.display = 'none';
      timerWrapper.classList.remove('is-warning');
      return;
    }

    // Show the wrapper when a timer is set
    timerWrapper.style.display = 'flex';

    const WARNING_THRESHOLD_MS = 3 * 60 * 1000; // 3 minutes

    globalTimerInterval = setInterval(() => {
      const timeLeft = endTime - Date.now();

      if (timeLeft > 0) {
        const mins = Math.floor(timeLeft / 60000);
        const secs = Math.floor((timeLeft % 60000) / 1000);
        timerTextEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        timerWrapper.classList.toggle('is-warning', timeLeft <= WARNING_THRESHOLD_MS);
      } else {
        clearInterval(globalTimerInterval);
        timerTextEl.textContent = "0:00";
        timerWrapper.classList.remove('is-warning');
        // Clear the timer from the database so it doesn't trigger again immediately
        db.ref(`events/${EVENT_ID}/peoplesCourtTimer`).set(null);
        // Redirect everyone to the itinerary
        window.location.href = 'index.html';
      }
    }, 100);
  });

  const LORE_MESSAGES = [
    "The People's Court has convened above the Marais in Paris for longer than any living record can prove.",
    "For generations, lovers, friends, and strangers have submitted their disputes to this room, trusting an impartial jury to determine where the truth lies.",
    "The wax seals and parchment of the past have given way to the digital inbox of the present.",
    "Tonight, the docket holds six unseen disputes. But I will not be casting the verdict...",
    "The gavel is yours."
  ];

  const DOCKET_STORIES = [
    {
      sender: "voucher.winner22@domain.com",
      name: "The Generous Friend",
      time: "10:15 AM",
      date: "Today, 10:15 AM",
      subject: "AITA for making my friends pay at a 'free' dinner?",
      text: "I won a $500 restaurant voucher online. I invited three friends and said dinner was on me. I assumed we'd eat normally, but they treated it like a blank check, ordering wagyu, double sides, and top-shelf cocktails. The bill came to $830. I put the $500 voucher down and told them we needed to split the remaining $330. They got furious, saying I invited them to a 'free dinner' and I should have warned them there was a budget."
    },
    {
      sender: "secret_bilingual@mail.com",
      name: "Language Barrier",
      time: "09:42 AM",
      date: "Today, 09:42 AM",
      subject: "AITA for hiding that I speak his language?",
      text: "I've been dating my boyfriend for 6 months. His family speaks Spanish. I'm actually fluent, but I never brought it up because I'm shy about my accent. At dinner, his mom made a passive-aggressive comment in Spanish about my job being a dead end. I instinctively replied in Spanish to defend myself. The table went dead silent. My boyfriend is furious and says I 'spied' on them for half a year just to trap them."
    },
    {
      sender: "unemployed.moh@web.net",
      name: "The Maid of Honor",
      time: "Yesterday",
      date: "Yesterday, 19:30",
      subject: "AITA for taking a job interview at a wedding?",
      text: "I've been unemployed and struggling financially for 8 months. I was the Maid of Honor at my best friend's wedding. Right as dinner started, a recruiter from my dream company called. She said the hiring manager was jumping on a flight and needed a 10-minute chat right now, or they were moving on. I stepped into the hallway to take it. The bride realized I was missing during a group toast and says I selfishly ruined her moment."
    },
    {
      sender: "wfh_survival@domain.com",
      name: "The Tired Roommate",
      time: "Yesterday",
      date: "Yesterday, 14:10",
      subject: "AITA for locking up my roommate's cat?",
      text: "My roommate got a cat that constantly screams and knocks over my monitors while I work from home. She refuses to train or contain it, saying 'cats will be cats.' To save my job, I started putting the cat in her bedroom with its litter, water, and food for the 3 hours a day I have client video calls. She came home early, saw the cat meowing at her closed door, and lost her mind. She's calling me abusive."
    },
    {
      sender: "puppy.regret@domain.com",
      name: "Overwhelmed Partner",
      time: "Tuesday",
      date: "Tuesday, 11:05",
      subject: "AITA for refusing to keep a surprise puppy?",
      text: "My partner and I agreed to adopt a dog, but I specifically said I only wanted a calm, older rescue dog. I went out of town for a weekend, and my partner surprised me by buying a 10-week-old Husky puppy from a breeder. I am exhausted just looking at it, and I told my partner they have to return or rehome it because I did not agree to this lifestyle change. They are crying and saying I'm heartless."
    },
    {
      sender: "locked_closet@mail.com",
      name: "The Older Sister",
      time: "Monday",
      date: "Monday, 08:20",
      subject: "AITA for putting fabric over family?",
      text: "My sister asked to borrow my expensive designer dress for her engagement party. I said no because she has a history of spilling drinks and ruining clothes. She swore she'd be careful, but I still refused and locked it in my closet. She ended up wearing a cheap dress and was crying in all her photos because she hated how she looked. My mom says I'm incredibly selfish and put a piece of fabric over my sister's happiness."
    }
  ];

  window.addEventListener('DOMContentLoaded', () => {
    // --- 5-CLICK HOST TRIGGER ---
    let pillClickCount = 0;
    let pillClickTimeout;

    // Use setInterval to check when the element is rendered, as it may be injected dynamically
    const checkPillInterval = setInterval(() => {
      const judgePill = document.querySelector('.judge-name-pill');
      if (judgePill) {
        clearInterval(checkPillInterval);
        judgePill.addEventListener('click', () => {
          pillClickCount++;
          clearTimeout(pillClickTimeout);
          pillClickTimeout = setTimeout(() => pillClickCount = 0, 2000); // Reset count after 2 seconds

          if (pillClickCount >= 5) {
            pillClickCount = 0;
            const mins = prompt("Host Override: Set global timer for the court (in minutes):", "15");
            if (mins !== null && !isNaN(mins) && mins.trim() !== "") {
              const endTime = Date.now() + parseFloat(mins) * 60000;
              db.ref(`events/${EVENT_ID}/peoplesCourtTimer`).set(endTime);
            }
          }
        });
      }
    }, 500);

    // 1. Open the doors dramatically
    setTimeout(() => {
      document.getElementById('doors').classList.add('open');
    }, 700);

    // Remove doors from flow entirely once the animation finishes
    setTimeout(() => {
      const doors = document.getElementById('doors');
      doors.style.display = 'none';
    }, 4200);

    // 2. Show the Intro Phase
    setTimeout(() => {
      document.getElementById('phaseIntro').classList.add('active');
      playLoreThread();
    }, 1400);

    // 3. Render the Email Inbox List
    const AVATAR_COLORS = ['#d94f8c', '#7c2f6e', '#c9863f', '#4a1949', '#b31f47', '#1b8c5e'];
    function initialsFor(name) {
      return name.split(' ').filter(w => w[0] === w[0].toUpperCase()).slice(0, 2).map(w => w[0]).join('') || name.slice(0, 2).toUpperCase();
    }

    const list = document.getElementById('docketList');
    DOCKET_STORIES.forEach((story, index) => {
      const row = document.createElement('div');
      row.className = 'email-row';
      row.id = `emailRow_${index}`;
      const color = AVATAR_COLORS[index % AVATAR_COLORS.length];
      row.innerHTML = `
        <div class="email-avatar" style="background:${color}">${initialsFor(story.name)}</div>
        <div class="email-content-preview">
          <div class="email-subject">${story.subject}</div>
          <div class="email-snippet">${story.text}</div>
        </div>
        <div class="email-right-col">
          <div class="email-time">${story.time}</div>
          <div class="email-star" onclick="toggleStar(event, this)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          </div>
        </div>
      `;
      row.addEventListener('click', () => openStory(index));
      list.appendChild(row);
    });
  });

  function toggleStar(evt, el) {
    evt.stopPropagation();
    el.classList.toggle('starred');
  }

  // Judge Sasha's lore, delivered as a fading literary prologue
  let loreTimeouts = [];

  function playLoreThread() {
    const thread = document.getElementById('loreThread');
    thread.innerHTML = '';
    let delayAcc = 800;

    LORE_MESSAGES.forEach((msg, index) => {
      const p = document.createElement('div');
      p.className = 'lore-paragraph';
      p.textContent = msg;
      thread.appendChild(p);

      const t = setTimeout(() => {
        p.classList.add('visible');
        if (index === LORE_MESSAGES.length - 1) {
          setTimeout(revealCta, 2500);
          const skipBtn = document.getElementById('skipLoreBtn');
          if (skipBtn) skipBtn.style.opacity = '0'; // Fade out skip button gracefully
        }
      }, delayAcc);

      loreTimeouts.push(t);
      // Pacing based on text length for a cinematic reading speed
      delayAcc += 2000 + (msg.length * 45);
    });
  }

  function skipLore() {
    // Clear all scheduled animations
    loreTimeouts.forEach(t => clearTimeout(t));

    // Instantly reveal all text
    const paragraphs = document.querySelectorAll('.lore-paragraph');
    paragraphs.forEach(p => {
      p.style.transition = 'opacity 0.5s ease';
      p.classList.add('visible');
    });

    // Instantly show the CTA button and hide the skip button
    revealCta();
    document.getElementById('skipLoreBtn').style.display = 'none';
  }

  function revealCta() {
    const cta = document.getElementById('introCta');
    cta.innerHTML = `
      <button class="btn-gold" onclick="openDocket()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        Open the inbox
      </button>
      <div class="btn-sub">six emails are waiting</div>
    `;
  }

  // Navigation Functions
  function backToIntro() {
    document.getElementById('phaseDocket').classList.remove('active');
    setTimeout(() => {
      document.getElementById('phaseIntro').classList.add('active');
    }, 400);
  }

  function openDocket() {
    document.getElementById('phaseIntro').classList.remove('active');
    setTimeout(() => {
      document.getElementById('phaseDocket').classList.add('active');
    }, 400); // Wait for fade out
  }

  let caseTimerInterval;

  function openStory(index) {
    const story = DOCKET_STORIES[index];

    // Mark as read visually
    document.getElementById(`emailRow_${index}`).classList.add('read');

    // Populate the open email view
    document.getElementById('storySubject').textContent = story.subject;
    document.getElementById('storySender').textContent = `${story.name} <${story.sender}>`;
    document.getElementById('storyDate').textContent = story.date;
    document.getElementById('storyDisplay').textContent = story.text;

    document.getElementById('phaseDocket').classList.remove('active');
    setTimeout(() => {
      document.getElementById('phaseStory').classList.add('active');
      startCaseTimer(60); // 60 seconds to read and vote
    }, 400);
  }

  function startCaseTimer(seconds) {
    clearInterval(caseTimerInterval);
    const bar = document.getElementById('caseTimerBar');
    let timeLeft = seconds;

    // Reset bar instantly
    bar.style.transition = 'none';
    bar.style.transform = 'scaleX(1)';
    bar.style.background = 'var(--gold)';

    // Start shrinking
    setTimeout(() => {
      bar.style.transition = 'transform 1s linear, background 0.5s ease';
      caseTimerInterval = setInterval(() => {
        timeLeft--;
        const percentage = timeLeft / seconds;
        bar.style.transform = `scaleX(${Math.max(0, percentage)})`;

        if (timeLeft <= 10) {
          bar.style.background = '#ff4d5e'; // Turns red at 10 seconds
        }

        if (timeLeft <= 0) {
          clearInterval(caseTimerInterval);
        }
      }, 1000);
    }, 50);
  }

  function backToDocket() {
    clearInterval(caseTimerInterval);
    document.getElementById('phaseStory').classList.remove('active');
    setTimeout(() => {
      document.getElementById('phaseDocket').classList.add('active');
    }, 400);
  }

  // Voting Functions
  function castVote(verdict) {
    const card = document.getElementById('verdictCard');
    const text = document.getElementById('verdictText');

    card.classList.remove('aita-red', 'aita-green');

    if (verdict === 'YTA') {
      text.textContent = 'ASSHOLE';
      card.classList.add('aita-red');
    } else {
      text.innerHTML = 'NOT THE<br>ASSHOLE';
      card.classList.add('aita-green');
    }

    card.style.display = 'flex';
    // Trigger reflow for CSS transition
    void card.offsetWidth;
    card.classList.add('visible');
  }

  function closeVerdict() {
    const card = document.getElementById('verdictCard');
    card.classList.remove('visible');

    setTimeout(() => {
      card.style.display = 'none';
      backToDocket(); // Automatically route back to the inbox
    }, 500);
  }
</script>
