<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>People's Court™ | The Archives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0614;
    --twilight: #2a113a;
    --magenta: #7c2f6e;
    --rose: #d94f8c;
    --gold: #dfb14a;
    --gold-glow: rgba(223, 177, 74, 0.5);
    --mist: #f0e6fa;
    --dim: #a69bb5;
    --crimson: #9e1432;
    --emerald: #126e47;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body, html {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--ink); color: var(--mist);
    font-family: 'Montserrat', sans-serif; overflow: hidden;
  }

  /* --- ATMOSPHERIC BACKGROUND --- */
  .sky {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(200deg, rgba(13,6,20,0.7) 0%, rgba(20,9,30,0.8) 40%, rgba(42,17,58,0.85) 100%),
      url('background-court.png');
    background-size: cover; background-position: center top; background-color: #0d0614;
  }
  .sky::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(1.5px 1.5px at 20% 15%, rgba(255,255,255,0.7) 100%, transparent),
                      radial-gradient(1.5px 1.5px at 75% 30%, var(--gold-glow) 100%, transparent),
                      radial-gradient(2px 2px at 80% 10%, rgba(255,255,255,0.5) 100%, transparent);
    opacity: 0.5; animation: sky-twinkle 7s ease-in-out infinite alternate;
  }
  @keyframes sky-twinkle { 0% { opacity: 0.3; } 100% { opacity: 0.7; } }

  /* --- MINIMALIST ITINERARY LINK --- */
  .itinerary-link {
    position: fixed; top: 24px; left: 24px; z-index: 500;
    display: flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim);
    text-decoration: none; opacity: 0.7; transition: opacity 0.3s ease, color 0.3s ease;
  }
  .itinerary-link:hover, .itinerary-link:active { opacity: 1; color: var(--gold); }
  .itinerary-link svg { width: 14px; height: 14px; transition: transform 0.3s ease; }
  .itinerary-link:hover svg { transform: translateX(-4px); }

  /* --- ORNATE 3D DOORS --- */
  .doors-wrapper {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; perspective: 2000px; pointer-events: none;
    background: #000; transition: background 2s ease 1s;
  }
  .doors-wrapper.open { background: transparent; }
  .door {
    width: 50%; height: 100%; background: #08040a; 
    display: flex; align-items: center; justify-content: center;
    transition: transform 4s cubic-bezier(0.2, 1, 0.3, 1), opacity 3s ease 1.5s;
    box-shadow: inset 0 0 150px rgba(0,0,0,1); position: relative; overflow: hidden;
  }
  .door::before {
    content: ''; position: absolute; top: 10%; bottom: 10%; left: 10%; right: 10%;
    border: 1px solid rgba(223, 177, 74, 0.15); border-radius: 2px;
  }
  .door.left { transform-origin: left; border-right: 1px solid rgba(223, 177, 74, 0.3); }
  .door.right { transform-origin: right; border-left: 1px solid rgba(223, 177, 74, 0.3); }
  .door-handle {
    width: 4px; height: 160px; border-radius: 2px;
    background: linear-gradient(to bottom, rgba(223,177,74,0.2), var(--gold), rgba(223,177,74,0.2));
    box-shadow: 0 0 15px var(--gold-glow); z-index: 2;
  }
  .door.left .door-handle { margin-left: auto; margin-right: 30px; }
  .door.right .door-handle { margin-right: auto; margin-left: 30px; }
  .doors-wrapper.open .door.left { transform: rotateY(-105deg); opacity: 0; }
  .doors-wrapper.open .door.right { transform: rotateY(105deg); opacity: 0; }

  /* --- SHARED UI --- */
  .court-container {
    position: relative; z-index: 10; width: 100%; height: 100%;
    overflow-y: auto; overflow-x: hidden;
    padding: 70px 20px 80px; display: flex; flex-direction: column; align-items: center;
  }
  #phaseIntro { padding-top: 30vh; }

  .section-layer {
    width: 100%; max-width: 650px; display: none; flex-direction: column; align-items: center;
    opacity: 0; animation: fade-up 0.8s ease forwards;
  }
  .section-layer.active { display: flex; }
  @keyframes fade-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* --- PHASE 1: LORE --- */
  .thread { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 28px; margin-bottom: 50px; }
  .lore-paragraph {
    font-family: 'Playfair Display', serif; font-size: 20px; font-style: italic;
    line-height: 1.6; color: rgba(240, 230, 250, 0.85); text-align: center;
    text-shadow: 0 4px 20px rgba(0,0,0,0.9);
  }
  .lore-paragraph:first-child { font-size: 32px; color: var(--gold); font-weight: 600; margin-bottom: 5px; }

  .btn-gold {
    background: linear-gradient(135deg, #f2d48f 0%, var(--gold) 100%);
    color: var(--ink); border: none; border-radius: 999px;
    padding: 16px 36px; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: 0.05em; cursor: pointer; 
    box-shadow: 0 8px 25px var(--gold-glow); transition: transform 0.2s ease, filter 0.2s ease;
    display: inline-flex; align-items: center; gap: 10px; animation: fade-up 0.6s ease forwards;
  }
  .btn-gold:active { transform: scale(0.96); filter: brightness(0.9); }

  /* --- PHASE 2: THE EMAIL INBOX --- */
  .email-client {
    width: 100%; background: rgba(13, 6, 20, 0.75);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(223, 177, 74, 0.2); border-radius: 12px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.9); overflow: hidden; display: flex; flex-direction: column;
  }
  .inbox-toolbar {
    display: flex; align-items: center; gap: 10px; padding: 16px 20px;
    background: rgba(0,0,0,0.6); border-bottom: 1px solid rgba(223, 177, 74, 0.15);
  }
  .inbox-title-block { flex: 1; }
  .email-title { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 600; color: var(--mist); letter-spacing: 0.02em; }
  .email-count { font-family: 'Montserrat', sans-serif; font-size: 12px; color: var(--gold); margin-top: 4px; }
  
  .me-avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #f2d48f, var(--gold));
    color: var(--ink); font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 14px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.2);
  }
  .me-avatar:active { transform: scale(0.9); }

  .inbox-instruction {
    padding: 14px 20px; background: rgba(223, 177, 74, 0.05);
    border-bottom: 1px solid rgba(240, 230, 250, 0.05);
    font-family: 'Playfair Display', serif; font-style: italic; font-size: 17px; color: var(--gold); text-align: center;
  }

  .email-row {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 18px 20px; border-bottom: 1px solid rgba(240, 230, 250, 0.05);
    cursor: pointer; transition: background 0.3s ease, border-left 0.2s ease;
    border-left: 3px solid transparent;
  }
  .email-row:hover { background: rgba(223, 177, 74, 0.08); }
  .email-row.read { opacity: 0.6; }
  .email-row.selected { border-left-color: var(--gold); background: rgba(223, 177, 74, 0.04); }

  .email-avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 14px; color: #fff;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }
  .email-content { flex: 1; min-width: 0; }
  .email-subject { font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 600; color: var(--mist); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .email-snippet { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 400; line-height: 1.4; }
  .email-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex-shrink: 0; }
  .email-time { font-family: 'Montserrat', sans-serif; font-size: 11px; color: var(--dim); }
  
  .star-icon { color: var(--dim); opacity: 0.4; cursor: pointer; transition: all 0.2s ease; }
  .star-icon:active { transform: scale(1.2); }
  .star-icon.starred { opacity: 1; color: var(--gold); filter: drop-shadow(0 0 5px var(--gold-glow)); fill: var(--gold); }

  /* --- PHASE 3: OPEN EMAIL & VOTING --- */
  .open-email-header { padding: 24px; border-bottom: 1px solid rgba(223, 177, 74, 0.15); background: rgba(0,0,0,0.4); }
  .oe-subject { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 600; color: var(--mist); margin-bottom: 20px; line-height: 1.3; }
  .oe-meta-grid { display: grid; grid-template-columns: 50px 1fr; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--mist); }
  .meta-label { color: var(--dim); }

  /* Burning Fuse Timer */
  .fuse-container { width: 100%; height: 4px; background: rgba(255,255,255,0.05); position: relative; }
  .fuse-bar { height: 100%; width: 100%; background: var(--gold); transform-origin: left; box-shadow: 0 0 10px var(--gold-glow); position: relative; }
  .fuse-bar::after { 
    content: ''; position: absolute; right: 0; top: -3px; width: 10px; height: 10px; 
    background: #fff; border-radius: 50%; box-shadow: 0 0 15px 5px var(--gold-glow);
  }
  .fuse-bar.critical { background: var(--crimson); box-shadow: 0 0 15px var(--crimson); }
  .fuse-bar.critical::after { box-shadow: 0 0 20px 8px var(--crimson); background: #ffb3b3; }

  .open-email-body { padding: 32px 24px; font-family: 'Playfair Display', serif; font-size: 20px; font-style: italic; line-height: 1.6; color: rgba(240, 230, 250, 0.95); }

  .voting-dock { padding: 24px; background: rgba(0,0,0,0.5); border-top: 1px solid rgba(223, 177, 74, 0.15); }
  .aita-buttons { display: flex; flex-direction: column; gap: 14px; width: 100%; margin-top: 16px; }
  .aita-btn {
    border: none; border-radius: 8px; cursor: pointer; display: block; width: 100%;
    font-family: 'Montserrat', sans-serif; font-weight: 700; padding: 22px 18px; font-size: 16px; 
    letter-spacing: 0.15em; color: #fff; text-transform: uppercase; transition: transform 0.2s ease, filter 0.2s ease;
  }
  .aita-btn:active { transform: scale(0.97); filter: brightness(0.8); }
  .aita-btn-red { background: linear-gradient(135deg, var(--crimson), #5c081b); box-shadow: 0 6px 20px rgba(158, 20, 50, 0.3); }
  .aita-btn-green { background: linear-gradient(135deg, var(--emerald), #073823); box-shadow: 0 6px 20px rgba(18, 110, 71, 0.3); }

  .back-link { font-family: 'Montserrat', sans-serif; font-size: 14px; color: var(--dim); text-decoration: underline; margin-top: 24px; cursor: pointer; background: none; border: none; padding: 8px; }

  /* --- FULL SCREEN VERDICT --- */
  .verdict-card {
    position: fixed; inset: 0; z-index: 99999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 30px; padding: 20px; text-align: center; opacity: 0; transition: opacity 0.5s ease;
    background-size: 200% 200%; animation: gradientMesh 5s ease infinite;
  }
  .verdict-card.visible { opacity: 1; }
  .verdict-card.red { background-image: linear-gradient(45deg, #9e1432, #5c081b, #d91c44, #38030f); }
  .verdict-card.green { background-image: linear-gradient(45deg, #126e47, #073823, #1ea36b, #032114); }
  @keyframes gradientMesh { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

  .verdict-text {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 800;
    font-size: 16vw; max-font-size: 90px; line-height: 1.1; color: #fff; text-shadow: 0 10px 30px rgba(0,0,0,0.6);
    margin-bottom: 10px; text-transform: uppercase; white-space: pre-line;
  }
  .verdict-instruction { color: rgba(255,255,255,0.85); font-family: 'Montserrat', sans-serif; font-size: 18px; margin-bottom: 50px; }

  .btn-ghost {
    background: transparent; color: #fff; border: 2px solid rgba(255,255,255,0.6); border-radius: 999px;
    padding: 15px 35px; font-family: 'Montserrat', sans-serif; font-size: 15px; cursor: pointer; transition: background 0.2s ease;
  }
  .btn-ghost:active { background: rgba(255,255,255,0.1); }
  .verdict-button-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }

  /* --- GLOBAL TIMER --- */
  .court-timer-wrap {
    position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(223, 177, 74, 0.3); border-radius: 999px; padding: 6px 14px 6px 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    transition: all 0.3s ease;
  }
  .court-timer-wrap.is-hidden { border-color: rgba(240, 230, 250, 0.1); padding-right: 10px; }
  .timer-toggle-btn { background: none; border: none; color: var(--dim); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
  .court-timer-text { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--mist); transition: opacity 0.3s ease, width 0.3s ease; opacity: 1; width: 45px; text-align: right; overflow: hidden; }
  .court-timer-wrap.is-hidden .court-timer-text { opacity: 0; width: 0; margin-left: -8px; }
  @keyframes timerPulse { 0%, 100% { box-shadow: 0 0 0 rgba(158, 20, 50, 0); } 50% { box-shadow: 0 0 20px rgba(158, 20, 50, 0.6); } }
  .court-timer-wrap.is-warning { border-color: var(--crimson); animation: timerPulse 2s infinite; }
  .court-timer-wrap.is-warning .court-timer-text { color: #ffb3b3; }
</style>

  <div class="sky"></div>

  <!-- Audio Asset for Gavel Strike -->

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDv47HEwF9APQLLoLdJgHwdLHzoYfTawyQ",
    authDomain: "relationships-d8119.firebaseapp.com",
    databaseURL: "https://relationships-d8119-default-rtdb.firebaseio.com",
    projectId: "relationships-d8119",
    storageBucket: "relationships-d8119.firebasestorage.app",
    messagingSenderId: "852389788989",
    appId: "1:852389788989:web:6c79282e08c665b54dd954"
  };
  const EVENT_ID = "default";
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const gavelAudio = document.getElementById('gavelSound');

  const timerWrapper = document.getElementById('courtTimerWrapper');
  const btnToggleTimer = document.getElementById('btnToggleTimer');
  let isTimerHidden = false;
  btnToggleTimer.addEventListener('click', () => {
    isTimerHidden = !isTimerHidden;
    timerWrapper.classList.toggle('is-hidden', isTimerHidden);
    document.getElementById('iconEyeOpen').style.display = isTimerHidden ? 'none' : 'block';
    document.getElementById('iconEyeClosed').style.display = isTimerHidden ? 'block' : 'none';
  });

  let globalTimerInterval;
  db.ref(`events/${EVENT_ID}/peoplesCourtTimer`).on('value', snap => {
    const endTime = snap.val();
    clearInterval(globalTimerInterval);
    if (!endTime) { timerWrapper.style.display = 'none'; return; }
    timerWrapper.style.display = 'flex';
    globalTimerInterval = setInterval(() => {
      const timeLeft = endTime - Date.now();
      if (timeLeft > 0) {
        timerWrapper.classList.toggle('is-warning', timeLeft <= 180000);
        document.getElementById('globalCourtTimerText').textContent = `${Math.floor(timeLeft / 60000)}:${Math.floor((timeLeft % 60000) / 1000).toString().padStart(2, '0')}`;
      } else {
        clearInterval(globalTimerInterval);
        document.getElementById('globalCourtTimerText').textContent = "0:00";
        db.ref(`events/${EVENT_ID}/peoplesCourtTimer`).set(null);
        window.location.href = 'index.html';
      }
    }, 100);
  });

  const LORE_MESSAGES = [
    "Welcome to the People's Court, loves.",
    "We've been judging strangers from a renowned Parisian courtroom since 1986. We once received letters by carrier pigeon; now, they simply arrive by email. Our generation has inherited the gavel.",
    "Tonight, we're dissecting strangers. Deliver your verdict with grace... or be absolutely ruthless. We're making history."
  ];

  const DOCKET_STORIES = [

  window.addEventListener('DOMContentLoaded', () => {
    let avatarClickCount = 0, avatarClickTimeout;
    const jsAvatar = document.querySelector('.me-avatar');
    if (jsAvatar) {
      jsAvatar.addEventListener('click', () => {
        avatarClickCount++;
        clearTimeout(avatarClickTimeout);
        avatarClickTimeout = setTimeout(() => avatarClickCount = 0, 2000); 
        if (avatarClickCount >= 5) {
          avatarClickCount = 0;
          const mins = prompt("Host Override: Set global timer (minutes):", "15");
          if (mins && !isNaN(mins)) db.ref(`events/${EVENT_ID}/peoplesCourtTimer`).set(Date.now() + parseFloat(mins) * 60000);
        }
      });
    }

    setTimeout(() => document.getElementById('doors').classList.add('open'), 700);
    setTimeout(() => document.getElementById('doors').style.display = 'none', 4200);
    setTimeout(() => { document.getElementById('phaseIntro').classList.add('active'); playLoreThread(); }, 1400);

    const AVATAR_COLORS = ['#38030f', '#2a113a', '#5c3a11', '#1a0b1d', '#5c081b', '#073823'];
    const list = document.getElementById('emailList');
    DOCKET_STORIES.forEach((story, index) => {
      const initials = story.name.split(' ').slice(0, 2).map(w => w[0]).join('');
      const row = document.createElement('div');
      row.className = 'email-row';
      row.id = `emailRow_${index}`;
      row.innerHTML = `
        <div class="email-avatar" style="background:${AVATAR_COLORS[index % AVATAR_COLORS.length]}">${initials}</div>
        <div class="email-content">
          <div class="email-subject">${story.subject}</div>
          <div class="email-snippet">${story.text}</div>
        </div>
        <div class="email-meta">
          <div class="email-time">${story.time}</div>
          <svg class="star-icon" onclick="toggleStar(event, this, 'emailRow_${index}')" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        </div>
      `;
      row.addEventListener('click', () => openStory(index));
      list.appendChild(row);
    });
  });

  function toggleStar(evt, iconEl, rowId) {
    evt.stopPropagation();
    iconEl.classList.toggle('starred');
  }

  function playLoreThread() {
    const thread = document.getElementById('loreThread');
    LORE_MESSAGES.forEach(msg => {
      const p = document.createElement('div');
      p.className = 'lore-paragraph';
      p.textContent = msg;
      thread.appendChild(p);
    });
    document.getElementById('introCta').innerHTML = `
      <button class="btn-gold" onclick="openDocket()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        Open the inbox
      </button>
    `;
  }

  function openDocket() {
    document.getElementById('phaseIntro').classList.remove('active');
    setTimeout(() => document.getElementById('phaseDocket').classList.add('active'), 400); 
  }

  let caseTimerInterval;
  function openStory(index) {
    const story = DOCKET_STORIES[index];
    document.getElementById(`emailRow_${index}`).classList.add('read');
    document.getElementById('storySubject').textContent = story.subject;
    document.getElementById('storySender').textContent = `${story.name} <${story.sender}>`;
    document.getElementById('storyDate').textContent = story.date;
    document.getElementById('storyDisplay').textContent = story.text;

    document.getElementById('phaseDocket').classList.remove('active');
    setTimeout(() => {
      document.getElementById('phaseStory').classList.add('active');
      startCaseTimer(60); 
    }, 400);
  }

  function startCaseTimer(seconds) {
    clearInterval(caseTimerInterval);
    const bar = document.getElementById('caseTimerBar');
    let timeLeft = seconds;
    bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)'; bar.classList.remove('critical');

    setTimeout(() => {
      bar.style.transition = 'transform 1s linear';
      caseTimerInterval = setInterval(() => {
        timeLeft--;
        bar.style.transform = `scaleX(${Math.max(0, timeLeft / seconds)})`;
        if (timeLeft <= 10) bar.classList.add('critical');
        if (timeLeft <= 0) clearInterval(caseTimerInterval);
      }, 1000);
    }, 50);
  }

  function backToDocket() {
    clearInterval(caseTimerInterval);
    document.getElementById('phaseStory').classList.remove('active');
    setTimeout(() => document.getElementById('phaseDocket').classList.add('active'), 400);
  }

  function castVote(verdict) {
    if (navigator.vibrate) navigator.vibrate([100, 50, 200]);
    gavelAudio.currentTime = 0;
    gavelAudio.play().catch(e => console.log("Audio play blocked."));

    const card = document.getElementById('verdictCard');
    const text = document.getElementById('verdictText');
    card.classList.remove('red', 'green');

    if (verdict === 'YTA') {
      text.textContent = 'ASSHOLE';
      card.classList.add('red');
    } else {
      text.innerHTML = 'NOT THE<br>ASSHOLE';
      card.classList.add('green');
    }

    card.style.display = 'flex';
    void card.offsetWidth;
    card.classList.add('visible');
  }

  function changeVote() {
    const card = document.getElementById('verdictCard');
    card.classList.remove('visible');
    setTimeout(() => card.style.display = 'none', 500);
  }

  function closeVerdict() {
    changeVote();
    setTimeout(() => backToDocket(), 500);
  }
</script>
</body>
</html>
